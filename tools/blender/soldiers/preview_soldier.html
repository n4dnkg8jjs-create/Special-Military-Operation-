<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script>window.addEventListener('error',()=>{window.__done=true});window.addEventListener('unhandledrejection',()=>{window.__done=true});</script>
<script type="module">
// Soldier preview (same renderer setup as tools/preview.html) with extra controls:
//  glb=  soldier glb        anims= glb with clips (default: glb)    anim= clip   t= 0..1 normalised time
//  weapon= weapon glb (parented to node `socket`, default weapon_socket)
//  show= comma list of mesh node names to keep (others hidden; skeleton kept)    hide= comma list
//  cy= look-at height  r= camera distance  az= comma list of azimuths  el= elevation  fov=
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const q = new URLSearchParams(location.search);
const W = 1400, H = 800;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa3ab);
const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff1dd, 2.4); sun.position.set(6,10,5); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); scene.add(sun); scene.add(new THREE.HemisphereLight(0xcfd8e0,0x3a3328,0.6));
sun.shadow.camera.left=sun.shadow.camera.bottom=-3; sun.shadow.camera.right=sun.shadow.camera.top=3;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color:0x6b6458,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const loader = new GLTFLoader();
const gltf = await loader.loadAsync(q.get('glb'));
const root = gltf.scene; scene.add(root); if(q.get('lift')) root.position.y=+q.get('lift'); if(q.get('noground')) ground.visible=false;
const show = q.get('show') ? q.get('show').split(',') : null, hide = q.get('hide') ? q.get('hide').split(',') : [];
let tris=0;
root.traverse(o=>{ if(o.isMesh){ o.castShadow=o.receiveShadow=true;
  let n=o.name, p=o; while(p && !(p.isSkinnedMesh||p.isMesh)) p=p.parent;
  const nm = o.parent && o.parent.type==='Group' ? o.parent.name : o.name;
  const keep = (!show || show.some(s=>nm===s||o.name===s)) && !hide.some(s=>nm===s||o.name===s) && !(q.get('hidelod') && (/_LOD1/.test(nm)||/_LOD1/.test(o.name))) && !(q.get('defaults') && o.userData && (o.userData.default_visible===false || (o.parent&&o.parent.userData&&o.parent.userData.default_visible===false)));
  o.visible = keep; if(keep){const g=o.geometry; tris += (g.index?g.index.count:g.attributes.position.count)/3;} } });
let clips = gltf.animations;
if (q.get('anims')) clips = (await loader.loadAsync(q.get('anims'))).animations;
if (q.get('weapon')) {
  const wg = await loader.loadAsync(q.get('weapon'));
  const sock = root.getObjectByName(q.get('socket')||'weapon_socket');
  if (sock) { sock.add(wg.scene); wg.scene.traverse(o=>{if(o.isMesh){o.castShadow=true; const g=o.geometry; tris += (g.index?g.index.count:g.attributes.position.count)/3;}}); }
}
let info = {};
let mixer=null, clip=null;
if (q.get('anim') && clips.length){
  mixer = new THREE.AnimationMixer(root);
  clip = clips.find(a=>a.name===q.get('anim')) || clips[0];
  const act = mixer.clipAction(clip); act.play(); mixer.setTime(clip.duration*(+(q.get('t')||0)));
  info.clip = clip.name + ':' + clip.duration.toFixed(2);
}
const ts = q.get('ts') ? q.get('ts').split(',').map(Number) : null;
root.updateMatrixWorld(true);
const box = new THREE.Box3();
root.traverse(o=>{ if(o.isSkinnedMesh && o.visible){ o.geometry.computeBoundingBox(); const b=new THREE.Box3();
  const pos=o.geometry.attributes.position, v=new THREE.Vector3(); for(let i=0;i<pos.count;i+=7){ o.getVertexPosition(i,v); v.applyMatrix4(o.matrixWorld); box.expandByPoint(v);} } else if(o.isMesh&&o.visible){ box.expandByObject(o);} });
const size = box.getSize(new THREE.Vector3()); const c = box.getCenter(new THREE.Vector3());
const cy = q.get('cy')!==null ? +q.get('cy') : c.y; const cx = q.get('cx')!==null ? +q.get('cx') : c.x; const cz = q.get('cz')!==null ? +q.get('cz') : c.z;
let azs = (q.get('az')||'30,150,270,0').split(',').map(Number); const el = +(q.get('el')||10);
if (ts) azs = ts.map((_,i)=>azs[i%azs.length]);
const r = +(q.get('r')||3.2);
const views = azs.length, cols = views>1?Math.min(views,+(q.get('cols')||4)):1, rows = Math.ceil(views/cols);
const cam = new THREE.PerspectiveCamera(+(q.get('fov')||30), (W/cols)/(H/rows), 0.01, 200);
renderer.setScissorTest(true); renderer.autoClear=false; renderer.clear();
for(let i=0;i<views;i++){
  if (ts && mixer){ mixer.setTime(clip.duration*ts[i]); root.updateMatrixWorld(true); }
  const a=azs[i]*Math.PI/180, e=el*Math.PI/180;
  cam.position.set(cx+r*Math.cos(e)*Math.sin(a), cy+r*Math.sin(e), cz+r*Math.cos(e)*Math.cos(a)); cam.lookAt(cx,cy,cz);
  const x=(i%cols)*W/cols, y=(rows-1-Math.floor(i/cols))*H/rows;
  renderer.setViewport(x,y,W/cols,H/rows); renderer.setScissor(x,y,W/cols,H/rows); renderer.render(scene,cam);
}
window.__info = Object.assign(info, {tris:Math.round(tris), bbox:[box.min.toArray().map(v=>+v.toFixed(3)), box.max.toArray().map(v=>+v.toFixed(3))], anims:clips.map(a=>a.name+':'+a.duration.toFixed(2))});
window.__done = true;
</script></body></html>
