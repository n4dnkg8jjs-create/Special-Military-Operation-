<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#888;overflow:hidden}</style>

<script>window.addEventListener('error',()=>{window.__done=true});window.addEventListener('unhandledrejection',()=>{window.__done=true});</script>
<script type="module">
// Weapon hold check with the game's own Soldier class (src/game/soldier.js): same weapon attachment (socket clone,
// LOD1 left visible as in the game, magazine moved by magTick, RPG-22 via raiseLauncher, side arm on the back socket).
//  dist= camera distance (m)   el= elevation (deg)   az= camera azimuth (deg)   t= clip phase 0..1   w= h=
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { FACTIONS, SQUAD_ROLES, ASSAULT_ROLES } from '/src/config.js';
import { Soldier, prepareSoldierAssets } from '/src/game/soldier.js';
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1400), H = +(q.get('h') || 800);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9aa3ab);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(4, 7, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02; scene.add(sun);
scene.add(new THREE.HemisphereLight(0xcfd8e0, 0x3a3328, 0.6));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x6b6458, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const loader = new GLTFLoader(), assets = { gltf: {}, manifest: {} };
const files = ['soldier_ua', 'soldier_ru', 'soldier_anims', 'ak74m', 'ak12', 'ak74m_optic', 'pkm', 'rpg7', 'rpg22'];
await Promise.all(files.map(async f => { assets.gltf[f] = await loader.loadAsync(`/assets/soldiers/${f}.glb`); }));
assets.manifest.soldiers = await (await fetch('/assets/soldiers/manifest.json')).json();
prepareSoldierAssets(assets);
const ph = +(q.get('t') || 0.5);
// [faction, role, clip, assault]
const lineup = [
  ['UA', SQUAD_ROLES[0], 'aim_stand'], ['UA', SQUAD_ROLES[1], 'aim_crouch'], ['UA', SQUAD_ROLES[2], 'aim_launcher'],
  ['UA', ASSAULT_ROLES[1], 'aim_stand', true], ['RU', ASSAULT_ROLES[1], 'aim_stand', true], ['RU', ASSAULT_ROLES[3], 'rpg22', true],
  ['RU', SQUAD_ROLES[5], 'reload_stand'], ['UA', SQUAD_ROLES[5], 'idle_rifle'],
];
const n = lineup.length;
lineup.forEach(([fid, role, clip, assault], i) => {
  const s = new Soldier({ assault: !!assault }, i, role, FACTIONS[fid], scene);
  s.pos.set((i - (n - 1) / 2) * 1.15, 0, 0); s.heading = +(q.get('heading') || 0.5); s.sync();
  if (clip === 'rpg22') { s.raiseLauncher(); clip = 'aim_launcher'; }
  s.play(clip, 0); const a = s.cur; a.time = a.getClip().duration * ph; s.mixer.update(0); s.magTick();
  if (s.lods) for (const o of s.lods) o.visible = o.userData.variantOn && o.userData.lod === 0;
});
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 30), W / H, 0.05, 200);
const d = +(q.get('dist') || 7), el = (+(q.get('el') || 12)) * Math.PI / 180, az = (+(q.get('az') || 0)) * Math.PI / 180;
const tgt = new THREE.Vector3(+(q.get('tx') || 0), +(q.get('ty') || 1.1), 0);
cam.position.set(tgt.x + d * Math.cos(el) * Math.sin(az), tgt.y + d * Math.sin(el), tgt.z + d * Math.cos(el) * Math.cos(az)); cam.lookAt(tgt);
renderer.render(scene, cam);
window.__info = { soldiers: n, calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
window.__done = true;
</script></body></html>
